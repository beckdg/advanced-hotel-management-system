services:
  postgres:
    image: postgres:16-alpine
    container_name: stayflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayflow
      POSTGRES_PASSWORD: stayflow
      POSTGRES_DB: stayflow
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stayflow -d stayflow']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stayflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://stayflow:stayflow@postgres:5432/stayflow?schema=public
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3001
    container_name: stayflow-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
